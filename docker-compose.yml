services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - ./backend/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
