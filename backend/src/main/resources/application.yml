spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: recoverai
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

recoverai:
  storage-mode: ${RECOVERAI_STORAGE_MODE:memory}
  public-webhook-only: ${RECOVERAI_PUBLIC_WEBHOOK_ONLY:false}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:${GOOGLE_APPLICATION_CREDENTIALS:}}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  recovery:
    max-attempts: 3
    payment-link-expiry-hours: 24
    ai-enabled: false
  thresholds:
    minimum-successful-payments-for-payment-link: ${RECOVERAI_MIN_SUCCESSFUL_PAYMENTS:1}
    minimum-payment-failure-score: ${RECOVERAI_MIN_PAYMENT_FAILURE_SCORE:0.70}
    minimum-abandonment-score: ${RECOVERAI_MIN_ABANDONMENT_SCORE:0.60}
    minimum-overdue-score: ${RECOVERAI_MIN_OVERDUE_SCORE:0.60}
    maximum-recovery-amount-paise: ${RECOVERAI_MAX_RECOVERY_AMOUNT_PAISE:5000000}
  ollama:
    enabled: ${OLLAMA_ENABLED:false}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:3b}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:30}
  security:
    auth-enabled: ${RECOVERAI_AUTH_ENABLED:false}
  detection:
    razorpay-failure-enabled: ${RECOVERAI_RAZORPAY_FAILURE_DETECTION_ENABLED:true}
